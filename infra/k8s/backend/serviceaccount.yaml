---
# ServiceAccount with IRSA annotation — lets backend pods assume the
# agent-prod-ca-backend-pod IAM role for S3 and Bedrock access.
# Replace BACKEND_POD_ROLE_ARN with the value from terraform output backend_pod_role_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: agent
  annotations:
    eks.amazonaws.com/role-arn: "BACKEND_POD_ROLE_ARN"
