---
# ClusterSecretStore: instructs the External Secrets Operator to read from
# AWS Secrets Manager in ca-central-1 using the IRSA role bound to the
# external-secrets service account.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ca-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
