---
# ExternalSecret: pulls the JSON blob from Secrets Manager and creates a
# standard Kubernetes Secret in the agent namespace. The backend and frontend
# pods consume this secret as environment variables (envFrom).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: app-secrets          # the k8s Secret that gets created
    creationPolicy: Owner
    deletionPolicy: Retain     # keep secret if ExternalSecret is deleted

  # Pull every key from the JSON secret as a separate env var
  dataFrom:
    - extract:
        key: agent-prod-ca-app-secrets
