---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agent
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: default

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: frontend

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 60
              preference:
                matchExpressions:
                  - key: "node/type"
                    operator: In
                    values: ["spot"]

      tolerations:
        - key: "spot"
          operator: "Equal"
          value: "true"
          effect: "PreferNoSchedule"

      terminationGracePeriodSeconds: 30

      containers:
        - name: frontend
          # IMAGE is replaced by CI/CD
          image: 978027421922.dkr.ecr.ca-central-1.amazonaws.com/agent-prod-ca-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"

          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            # NEXT_PUBLIC_API_URL must be baked in at docker build time via:
            #   --build-arg NEXT_PUBLIC_API_URL=https://agent.alexcty.com
            # It is NOT a runtime env var — Next.js inlines it at build.
          envFrom:
            - secretRef:
                name: app-secrets

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
