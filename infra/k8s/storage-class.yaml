---
# gp3 StorageClass — backed by the aws-ebs-csi-driver installed by bootstrap-ca.sh.
# gp3 is faster and cheaper than gp2 (baseline 3000 IOPS, 125 MB/s free).
# This class is used by the ChromaDB PVC.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer   # only provision when a pod is scheduled; determines AZ automatically
reclaimPolicy: Retain                     # keep the EBS volume even if the PVC is deleted (safety)
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
